BASE: ['']
TOOLBOX_MODE: "train_and_test"      # "train_and_test"  or "only_test"
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 9e-3
  MODEL_FILE_NAME: mrnirp_rhythmformer
  PLOT_LOSSES_AND_LR: True
  DATA:
    FILTERING:
      USE_EXCLUSION_LIST: True
      EXCLUSION_LIST: [
        # Face detection failed - Defective videos - Defective PPG signal:
        'subject 7', # label 이상
        'subject 12', # label 이상
        'driving_still_motion_940', 'driving_small_motion_940'] #, 'driving_still_motion_940', 'driving_small_motion_940' 
      SELECT_TASKS: True
      TASK_LIST: ['subject1', 'subject2', 'subject3', 'subject4', 'subject5', 'subject6', 'subject8', 'subject9', 'subject10', 'subject11','subject13','subject14', 'subject16']
    FS: 30
    DATASET: MR-NIRP
    DO_PREPROCESS: False                 # if first time, should be true
    DATA_FORMAT: NDCHW
    DATA_PATH: "/path/to/MR-NIRP-CAR/RawData/"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/path/to/MR-NIRP-CAR/Processed_data"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: "Standardized_160"
    BEGIN: 0.0
    END: 1.0
    PREPROCESS :
      DATA_TYPE: ['Standardized']
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.2
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
VALID:
  DATA:
    FILTERING:
      USE_EXCLUSION_LIST: True
      EXCLUSION_LIST: [
        # Face detection failed - Defective videos - Defective PPG signal:
        'subject 7', # label 이상
        'subject 12', # label 이상
      #  'driving_large_motion_975', 'driving_still_motion_940', 'driving_small_motion_940' # driving_large_motion_975
      ]
      SELECT_TASKS: True
      TASK_LIST: ['subject1', 'subject2', 'subject3', 'subject4', 'subject5', 'subject6', 'subject8', 'subject9', 'subject10', 'subject11','subject13','subject14', 'subject16']
    FS: 30
    DATASET: MR-NIRP
    DO_PREPROCESS: False                 # if first time, should be true
    DATA_FORMAT: NDCHW
    DATA_PATH: "/path/to/MR-NIRP-CAR/RawData/"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/path/to/MR-NIRP-CAR/Processed_data"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: "Diff_160"
    BEGIN: 0.8
    END: 1.0
    PREPROCESS :
      DATA_TYPE: ['DiffNormalized']
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.2
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: True                      # to use provided validation dataset to find the best epoch, should be false
  DATA:
    FILTERING:
      USE_EXCLUSION_LIST: True
      EXCLUSION_LIST: [
        # Face detection failed - Defective videos - Defective PPG signal:
        'subject 7', # label 이상
        'subject 12', # label 이상
        'driving_still_motion_940', 'driving_small_motion_940'] #, 'driving_still_motion_940', 'driving_small_motion_940' 
      SELECT_TASKS: True
      TASK_LIST: ['subject15', 'subject17', 'subject18', 'subject19']
    FS: 30
    DATASET: MR-NIRP
    DO_PREPROCESS: False                 # if first time, should be true
    DATA_FORMAT: NDCHW
    DATA_PATH: "/path/to/MR-NIRP-CAR/RawData/"                     # Raw dataset path, need to be updated
    CACHED_PATH: "/path/to/MR-NIRP-CAR/Processed_data"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: "Standardized_160"
    BEGIN: 0.0
    END: 1.0
    PREPROCESS :
      DATA_TYPE: ['Standardized']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.2
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.1
  NAME: RhythmFormer
  MODEL_DIR: "runs/model_outputs/RhythmFormer"    # need to be updated
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 10        # In seconds
  MODEL_PATH:   ""
