BASE: ['']
TOOLBOX_MODE: "only_test"
SEED: 0
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR']
  USE_LAST_EPOCH: True
  DATA:
    FILTERING:
      USE_EXCLUSION_LIST: True
      EXCLUSION_LIST: ['B*', 'AFZ3', 'AMZ4_AT']
    FS: 30
    DATASET: PhysDrive
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/path/to/PhysDrive/RawData/"
    CACHED_PATH: "/path/to/PhysDrive/Processed_test"
    EXP_DATA_NAME: "Standardized_160"
    FILE_LIST_PATH: "/path/to/PhysDrive/Processed_test/DataFileLists/Standardized_160_0.8_1.0_n35.csv"
    BEGIN: 0.8
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'Y5F'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.2
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.1
  NAME: RhythmFormer
  MODEL_DIR: "runs/model_outputs/RhythmFormer"
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 10
  MODEL_PATH: ""
